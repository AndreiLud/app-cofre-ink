name: release

# A tag, mostly. Pushing to main publishes nothing: a release is a decision somebody
# makes, and the tag is how they make it.
#
#   pnpm version 0.1.0 --no-git-tag-version   then write the section in CHANGELOG.md
#   git tag v0.1.0 && git push origin v0.1.0
#
# The button is the other way in, for the day the notes need redoing on their own: a
# release that went out without them, or a changelog corrected afterwards. It takes the
# tag by name and leaves the image alone, because a tag is built once and the release
# already points at what came out.
on:
  push:
    tags: ["v*"]
  workflow_dispatch:
    inputs:
      tag:
        description: The tag to write the notes of, for example v0.1.1
        required: true
        type: string

permissions:
  contents: write
  packages: write

# Which tag this run is about. A push carries it in the ref, and the button carries it
# in the box, and everything below reads this instead of knowing which of the two it is.
env:
  TAG: ${{ inputs.tag || github.ref_name }}

concurrency:
  group: release-${{ inputs.tag || github.ref_name }}

jobs:
  verify:
    name: the tag is coherent, and the code still passes
    runs-on: ubuntu-latest
    steps:
      # The tag, and not the branch the button was pressed from. What a release says is
      # what its own commit says, so the notes are read from there and never from
      # whatever main happens to hold today.
      - uses: actions/checkout@v4
        with:
          ref: ${{ env.TAG }}

      - uses: pnpm/action-setup@v4

      - uses: actions/setup-node@v4
        with:
          node-version: 24
          cache: pnpm

      - name: install
        run: pnpm install --frozen-lockfile

      # Before anything is built or published: the tag, the version in package.json and
      # the section in the changelog all say the same thing, or this stops here.
      - name: the tag, the version and the changelog agree
        run: node scripts/releaseNotes.mjs "$TAG"

      - name: lint, types, the writing rule and the two languages
        run: pnpm run check

      # The flows in a browser are not repeated here. They ran on this commit when it
      # landed on main, and they take eight minutes that would be spent proving the
      # same thing twice.
      - name: tests
        run: pnpm run test

      - name: build
        run: pnpm run build

  image:
    name: the container, on the registry of this repository
    needs: verify
    # Only a tag push builds one. The button exists for the notes, and the image for a
    # tag was built the day that tag was pushed: building it again would either produce
    # the same thing for twenty minutes, or produce something different from what the
    # release already points at, which is worse.
    if: github.event_name == 'push'
    runs-on: ubuntu-latest
    steps:
      # The same tag the other two check out. On a push it is what the default would
      # have given anyway, and it is written out so that loosening the line above never
      # quietly builds an image of something else.
      - uses: actions/checkout@v4
        with:
          ref: ${{ env.TAG }}

      # Two architectures, because the guide says a Raspberry Pi is a place to run this
      # and a Pi is not an Intel machine. The second one is emulated and slow, which is
      # a price worth paying on a tag and not on every push.
      - uses: docker/setup-qemu-action@v3
      - uses: docker/setup-buildx-action@v3

      - uses: docker/login-action@v3
        with:
          registry: ghcr.io
          username: ${{ github.actor }}
          password: ${{ secrets.GITHUB_TOKEN }}

      # It writes the lower case name the registry insists on, and the set of tags: the
      # full version, the major and minor, and latest for a version that is not a
      # preview of something.
      - id: names
        uses: docker/metadata-action@v5
        with:
          images: ghcr.io/${{ github.repository }}
          tags: |
            type=semver,pattern={{version}}
            type=semver,pattern={{major}}.{{minor}}

      - uses: docker/build-push-action@v6
        with:
          context: .
          platforms: linux/amd64,linux/arm64
          push: true
          tags: ${{ steps.names.outputs.tags }}
          labels: ${{ steps.names.outputs.labels }}
          cache-from: type=gha
          cache-to: type=gha,mode=max

  release:
    name: the release, with the notes somebody wrote
    needs: [verify, image]
    # The image job does not run when the button was pressed, and a dependency that was
    # skipped skips everything after it unless that is said out loud. Said out loud
    # here, along with the thing that must never happen: this running after a verify
    # that failed, or after an image that was attempted and did not come out.
    if: >-
      ${{ !cancelled()
      && needs.verify.result == 'success'
      && (needs.image.result == 'success' || needs.image.result == 'skipped') }}
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4
        with:
          ref: ${{ env.TAG }}

      - uses: pnpm/action-setup@v4

      - uses: actions/setup-node@v4
        with:
          node-version: 24
          cache: pnpm

      # The notes are the section of the changelog for this version, so the file in the
      # repository and the page on the release say the same thing and only one of them
      # has to be written.
      - name: the notes
        run: node scripts/releaseNotes.mjs "$TAG" > notes.md

      # Written so that running it twice ends the same way it ended the first time.
      #
      # A tag gets moved. Somebody spots one more thing on the morning of a release,
      # fixes it, points the tag at the fix and pushes again, and this runs a second
      # time. Creating a release that exists is refused by the API, so the second run
      # failed on its last line, after the image had already been built and pushed,
      # which is the most expensive place to fail and the least informative. It also
      # failed for a release somebody had made by hand, which is a reasonable thing to
      # have done and not a reason to stop.
      #
      # So it asks first, and edits what is there instead of refusing.
      # TAG is not set again here. It comes from the top of the file, where it already
      # knows whether this was a push or the button, and setting it again would quietly
      # hand this step the branch instead of the tag.
      - name: publish it, or bring what is published up to date
        env:
          GH_TOKEN: ${{ github.token }}
        run: |
          if gh release view "$TAG" > /dev/null 2>&1; then
            echo "a release for $TAG is already there, so its notes are brought up to date"
            gh release edit "$TAG" --title "$TAG" --notes-file notes.md
          else
            gh release create "$TAG" --title "$TAG" --notes-file notes.md
          fi
