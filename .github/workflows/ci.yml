name: ci

on:
  push:
    branches: [main]
  pull_request:

concurrency:
  group: ci-${{ github.ref }}
  cancel-in-progress: true

jobs:
  check:
    name: lint, types, tests and build
    runs-on: ubuntu-latest
    strategy:
      fail-fast: false
      matrix:
        # SQLite ships inside Node and is stable from 24. On 22 it needs a flag, and
        # running both makes sure the project keeps working either way.
        node: [22, 24]
    steps:
      - uses: actions/checkout@v4

      - uses: pnpm/action-setup@v4

      - uses: actions/setup-node@v4
        with:
          node-version: ${{ matrix.node }}
          cache: pnpm

      - name: install
        run: pnpm install --frozen-lockfile

      - name: writing rule
        run: pnpm run check:writing

      - name: lint and format
        run: pnpm run lint

      - name: types
        run: pnpm run typecheck

      - name: tests
        run: pnpm run test

      - name: build
        run: pnpm run build

  e2e:
    name: flows in a real browser
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4

      - uses: pnpm/action-setup@v4

      - uses: actions/setup-node@v4
        with:
          node-version: 24
          cache: pnpm

      - name: install
        run: pnpm install --frozen-lockfile

      - name: browser
        run: pnpm --filter @cofre/web exec playwright install --with-deps chromium

      - name: flows
        run: pnpm run test:e2e

      - uses: actions/upload-artifact@v4
        if: failure()
        with:
          name: playwright-report
          path: apps/web/playwright-report
          retention-days: 7
