name: ci

on:
  push:
    branches: [main]
  pull_request:

concurrency:
  group: ci-${{ github.ref }}
  cancel-in-progress: true

jobs:
  check:
    name: lint, types, tests and build
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4

      - uses: pnpm/action-setup@v4

      - uses: actions/setup-node@v4
        with:
          node-version: 22
          cache: pnpm

      - name: install
        run: pnpm install --frozen-lockfile

      - name: writing rule
        run: pnpm run check:writing

      - name: lint and format
        run: pnpm run lint

      - name: types
        run: pnpm run typecheck

      - name: tests
        run: pnpm run test

      - name: build
        run: pnpm run build
