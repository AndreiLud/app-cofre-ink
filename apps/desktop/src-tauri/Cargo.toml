[package]
name = "cofre"
version = "0.1.0"
description = "Cofre in a window of its own"
authors = ["Andrei Ludescher"]
license = "MIT"
repository = "https://github.com/AndreiLud/open-cofre"
edition = "2021"
rust-version = "1.77.2"

# A library and a binary, not just a binary. A telephone does not start a program, it
# loads a library and calls into it, so the whole of the shell lives in the library and
# the binary is the one line a computer needs.
[lib]
name = "cofre_lib"
crate-type = ["staticlib", "cdylib", "rlib"]

[build-dependencies]
tauri-build = { version = "2", features = [] }

[dependencies]
tauri = { version = "2", features = [] }

[features]
default = []

# A smaller binary, because the whole of the application is the web build inside it and
# nothing here is hot.
[profile.release]
opt-level = "s"
lto = true
codegen-units = 1
panic = "abort"
strip = true
